plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'realm-android'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.skart.biasroulette"
        minSdk 34
        targetSdk 34
        versionCode 7
        versionName "1.6"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    namespace 'com.example.biasroulette'

}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.4.0'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3" //20220916
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6" //20220916

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'androidx.recyclerview:recyclerview:1.3.2' //20220916

    implementation 'com.beardedhen:androidbootstrap:2.3.2'//20221110

    implementation "androidx.multidex:multidex:2.0.1"//20221222

}